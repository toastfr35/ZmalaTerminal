verification: Inject current and stale call results, expired and failed leases, stop/end transitions and
  malformed/oversized images. Assert layer removal and no media termination. Exercise resize and native
  surface retention in the display HLT; qualify actual speech separately.
  Control request-start and completion times, including a completion after expiry.
  Check negative, zero and above-12000 remaining_ms values, unchanged-revision
  image reuse, one in-flight worker and query encoding of reserved Call-ID characters.
