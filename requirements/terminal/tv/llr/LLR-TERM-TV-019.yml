text: |
  TV checks shall be opened explicitly from the TV setup card in Settings,
  using the selected language. Enrollment, cached startup and configuration polls
  shall not open the wizard or block ordinary use on unfinished checks. Startup
  shall validate saved TV identity in the background and enable only completed,
  user-passed capabilities. Opening TV setup shall allow checks to be repeated,
  suspend maintenance and ordinary call/idle TV actions, and completion shall
  return to the same settings card and resume maintenance. Unsupported
  desktop TV control shall show an explanatory message without running commands.
verification: |
  Verify enrollment and cached startup apply configuration without opening TV
  setup. Open/reopen it from Settings, complete or skip checks, and verify the
  return page, language, maintenance lifetime and independent capability gates.
  Exercise background restoration with completed, incomplete and changed-TV
  results. Record physical CEC checks separately from Windows UI acceptance.
