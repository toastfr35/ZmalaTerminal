text: |
  Always on shall retain power. Both automatic modes shall switch the shared
  supply off after 60 seconds of inactivity. Camera only shall ignore the
  battery. Camera and dock mode shall retain or restore power below 25 percent
  or with an unknown battery level. Calls, ringing, active setup, held buttons,
  ringtone preview and stale application state shall retain or restore power.
  The idle interval shall start when ongoing activity ends.
verification: |
  Exercise the 60-second and 25-percent boundaries and each inhibitor with a
  controlled clock. Check all three modes and the missing battery behavior.
