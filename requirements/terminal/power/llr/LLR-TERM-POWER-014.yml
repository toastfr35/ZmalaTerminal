text: |
  An accepted incoming call, an outgoing call attempt and an audible ringtone
  preview shall immediately request USB power restoration. The request shall
  precede TV routing, call preflight or playback. Camera-based setup and native
  media initialization or reconfiguration shall request power before probing
  devices. Device enumeration may complete later. Navigation, ordinary Settings
  changes and muted previews shall leave USB media sleep undisturbed.
verification: |
  Feed normal, consumed and debounced inputs and volume-overlay clicks with USB
  asleep. Check call and preview wake ordering and that media-free Settings
  changes, muted previews and navigation leave the idle clock unchanged.
