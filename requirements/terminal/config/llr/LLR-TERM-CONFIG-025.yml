text: |
  At the server QR setup step a combined terminal shall recognize the printed activation command, start its local server and enroll with its private export. Show the server configuration page on activation and from Settings while activated. Show server and local connection status, LAN administration URL and QR, a mobile-data HTTPS test, and separately timestamped installer confirmation of two-way media. Offer a retry after failure and return to contacts after enrollment.
verification: |
  Exercise exact activation input, validation, page visibility, retries, status transitions and manual call confirmation. Inspect the Windows display and decode the printed card.
