text: |
  Settings shall present all settings and actions in one wrapping carousel with
  five visible icon cards. The selected card shall be centred, and each setting's
  current value shall appear below its icon. Left/right shall select a card;
  green shall open its individual page. In an editor, left/right shall change
  only the draft; green shall accept and return to the same carousel selection
  after acknowledgement; red shall discard and return without saving. Red on
  the carousel shall ask before exiting: green exits, red retains the selected
  card, and arrows have no effect. Each page shall show its own full-width hints.
  The language card shall show the saved language's flag. Language choices
  shall reuse those flags alongside native names. Language and ringtone choices
  shall use five-card wrapping carousels with the draft centred, even when a
  short ringtone list repeats. Portrait count shall use two cards showing
  miniature contact-screen previews of three and five portraits. Automatic
  framing shall use two cards showing matched cartoon examples before and after
  reframing within the 2x zoom limit, labelled No and Yes in the selected language. Volumes and delays
  shall use a stepped bar with the draft value and endpoints. The selected choice
  shall be visibly highlighted. Control captions shall start with a capital
  letter in scripts with letter case. The Zmala logo
  shall remain visible at the top left throughout Settings without a mismatched
  background rectangle.
verification: |
  Navigate every setting and both carousel wrap boundaries. Verify five visible
  icon cards with saved values, green acknowledgement, red cancellation and the
  selected card on return. Exercise both exit answers and ignored arrows. Render
  every language at 900x620 and 1280x720; check icons, values and controls fit.
  Verify all language flags, draft/cancel flag changes, two-choice boxes,
  numerical bars at both endpoints, and the persistent corner logo.
