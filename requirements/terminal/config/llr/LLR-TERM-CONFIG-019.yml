text: |
  Settings shall open a carousel of exactly three icon categories: Calls, Sound
  and Terminal. Left/right shall rotate categories and green shall open the
  selected category. Within a category, left/right shall select an entry and
  green shall open its individual page. In an editor, left/right shall change
  only the draft; green shall accept and return to the category after acknowledgement;
  red shall discard and return without saving. Red on a category shall return
  to the carousel. Red on the carousel shall ask before exiting: green exits,
  red retains the selected category, and arrows have no effect. Each page shall
  show its own full-width button hints.
verification: |
  Navigate all three categories and every setting. Verify category and option
  wrap/clamp behavior, green acknowledgement, red cancellation and return paths.
  Exercise both exit answers and ignored arrows. Render all supported languages
  at 900x620 and 1280x720 and check icons, labels, values and controls stay bounded.
