text: |
  Settings shall hide the normal status icons and show the assigned terminal ID
  and the running Terminal software version in small text at the bottom.
  The carousel order shall be language, automatic answer, automatic framing,
  ringtone, ringtone volume, button sounds volume,
  portraits shown, return to TV, TV setup, Updates, and reset to factory defaults.
