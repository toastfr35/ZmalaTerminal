text: |
  Confirmed reset shall stop media and maintenance work and invalidate pending
  responses. It shall remove this profile’s enrollment, cache, notifications and
  setup-test results. It shall also remove the terminal remote's saved Bluetooth
  bond from the host and clear the pairing service's saved bond identity. It shall
  preserve other profiles, server accounts and unrelated Bluetooth device bonds.
  Setup shall require fresh remote pairing and the remote button test again;
  the previous bond shall not be reused after reset or reboot.
verification: |
  Reset a populated profile beside another profile. Deliver late results and check
  deletion boundaries. Check that the terminal remote's host bond and pairing
  service identity are removed while unrelated Bluetooth bonds remain. Reboot
  after reset and verify that setup requires fresh pairing and button verification.
