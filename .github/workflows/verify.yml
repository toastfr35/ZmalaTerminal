name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up verification dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
      - run: make requirements
      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements/output/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate component version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if printf '%s\n' "$changed" | grep -qvE '^(requirements/|AGENTS\.md$|\.github/workflows/verify\.yml$)'; then
            python build_tools/release/component.py check-pr-version
          fi
      - name: Install Linux runtime and display test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil python3-pil.imagetk python3-gi python3-gi-cairo python3-cairo python3-websocket gir1.2-pango-1.0 xvfb xauth nftables iproute2 fdisk util-linux e2fsprogs libubootenv-tool
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/zmala"
          "$RUNNER_TEMP/zmala/bin/pip" install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
          echo "$RUNNER_TEMP/zmala/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r build_tools/leaflet/requirements.txt -r build_tools/release/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - uses: actions/checkout@v4
        with:
          repository: toastfr35/ZmalaServer
          ref: 54c9fdc72110e90fc6d402d6a339b49fb7e3efbf
          path: .peer/ZmalaServer
          persist-credentials: false
      - run: npm --prefix .peer/ZmalaServer/zmala_server ci --ignore-scripts
      - run: xvfb-run -a make lint test-llt test-hlt test-hlt-display test-adhoc package leaflets
        env:
          ZMALA_TEST_SERVER_ROOT: .peer/ZmalaServer
      - name: Native Pi SDK checks
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends build-essential python3-pil libavcodec-dev libavutil-dev pkg-config libmediastreamer-dev libegl-dev libgles-dev libglew-dev ca-certificates patch
            sh tests/support/terminal/run-native.sh
            python3 build_tools/linux/build-turn.py
          '
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-package
          path: |
            build_tools/dist/ZmalaTerminal-*.tar.gz*
            build_tools/dist/leaflets/ZmalaTerminal-Leaflets.zip
          if-no-files-found: error
